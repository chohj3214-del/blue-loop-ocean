<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link href="https://unpkg.com/maplibre-gl@5.2.0/dist/maplibre-gl.css" rel="stylesheet"><style>body{margin:0;font-family:Arial;color:#073954}header{padding:18px;font-weight:800;font-size:22px}#map{height:calc(100vh - 70px)}.pin{background:#087fb6;color:white;border:3px solid white;border-radius:50%;width:30px;height:30px;display:grid;place-items:center}</style><header>BlueLoop · 부산 스마트 수거함</header><div id="map"></div><script src="https://unpkg.com/maplibre-gl@5.2.0/dist/maplibre-gl.js"></script><script>const m=new maplibregl.Map({container:'map',style:'https://tiles.openfreemap.org/styles/liberty',center:[129.073,35.108],zoom:10.5});[['해운대',35.159,129.16],['광안리',35.153,129.119],['송도',35.076,129.02],['다대포',35.046,128.965],['태종대',35.052,129.087]].forEach(x=>{let e=document.createElement('div');e.className='pin';e.textContent='♻';new maplibregl.Marker({element:e}).setLngLat([x[2],x[1]]).setPopup(new maplibregl.Popup().setText(x[0]+' 가상 스마트 수거함')).addTo(m)})</script>
